name: XD Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'git ref to build'
        required: true
      java:
        description: 'java version'
        required: false
        default: '21'
      build_cmd:
        description: 'gradle command'
        required: false
        default: 'build'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java }}
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew ${{ inputs.build_cmd }} --stacktrace
      - name: Upload jar artifacts
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            build/libs/*.jar
            */build/libs/*.jar
            */*/build/libs/*.jar
          if-no-files-found: warn
      - name: Publish jars to xd-dist branch
        if: ${{ success() }}
        run: |
          git config user.name "xd-ci"
          git config user.email "ci@xd.local"
          git checkout -B xd-dist
          rm -rf dist && mkdir -p dist
          find . -path "*/build/libs/*.jar" ! -name "*sources*" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true
          if [ -n "$(ls dist/*.jar 2>/dev/null)" ]; then
            git add dist
            git commit -m "xd-ci: jars from ${{ inputs.tag }} [skip ci]" || true
            git push origin xd-dist --force
          else
            echo "no jars found to publish"
          fi
